<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="schedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="schedShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#schedBg)"/>
  <circle cx="300" cy="200" r="140" fill="#DCFCE7" opacity="0.6"/>

  <!-- Calendar card in background -->
  <g transform="translate(100, 65)" filter="url(#schedShadow)">
    <rect x="0" y="0" width="260" height="230" rx="20" fill="#FFFFFF"/>
    <!-- Calendar Header (Sunset Orange #FF5841 / Forest Green #0D9488 accent) -->
    <path d="M0 20 A20 20 0 0 1 20 0 h220 a20 20 0 0 1 20 20 v38 H0 Z" fill="#0D9488"/>
    <!-- Rings -->
    <rect x="45" y="-10" width="12" height="20" rx="4" fill="#134E4A"/>
    <rect x="125" y="-10" width="12" height="20" rx="4" fill="#134E4A"/>
    <rect x="205" y="-10" width="12" height="20" rx="4" fill="#134E4A"/>
    <text x="130" y="36" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="1">MONTHLY ROSTER</text>

    <!-- Calendar Grid Dates -->
    <g fill="#CBD5E1">
      <circle cx="45" cy="85" r="6"/><circle cx="88" cy="85" r="6"/><circle cx="130" cy="85" r="6"/><circle cx="172" cy="85" r="6"/><circle cx="215" cy="85" r="6"/>
      <circle cx="45" cy="120" r="6"/><circle cx="88" cy="120" r="6"/>
      <!-- Active routine date 1 (Maid Morning Slot) -->
      <circle cx="130" cy="120" r="15" fill="#0D9488" fill-opacity="0.18"/>
      <circle cx="130" cy="120" r="8" fill="#0D9488"/>
      <circle cx="172" cy="120" r="6"/><circle cx="215" cy="120" r="6"/>
      <circle cx="45" cy="155" r="6"/><circle cx="88" cy="155" r="6"/><circle cx="130" cy="155" r="6"/>
      <!-- Active routine date 2 (Cook Evening Slot) -->
      <circle cx="172" cy="155" r="15" fill="#FF5841" fill-opacity="0.2"/>
      <circle cx="172" cy="155" r="8" fill="#FF5841"/>
      <circle cx="215" cy="155" r="6"/>
      <circle cx="45" cy="190" r="6"/><circle cx="88" cy="190" r="6"/><circle cx="130" cy="190" r="6"/><circle cx="172" cy="190" r="6"/><circle cx="215" cy="190" r="6"/>
    </g>
  </g>

  <!-- Big Crisp Clock in Foreground -->
  <g transform="translate(300, 90)" filter="url(#schedShadow)">
    <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6"/>
    <circle cx="100" cy="100" r="80" fill="#F8FAFC"/>

    <!-- Clock markings -->
    <line x1="100" y1="30" x2="100" y2="40" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="170" y1="100" x2="160" y2="100" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="170" x2="100" y2="160" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="100" x2="40" y2="100" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

    <!-- Hands: pointing at 9:00 AM Routine slot -->
    <line x1="100" y1="100" x2="60" y2="100" stroke="#0F172A" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="100" y2="48" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="8" fill="#0D9488"/>
    <circle cx="100" cy="100" r="3.5" fill="#FFFFFF"/>

    <!-- Alarm bells on top -->
    <path d="M50 36 a18 18 0 0 1 18 -9 l3 8" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M150 36 a18 18 0 0 0 -18 -9 l-3 8" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Scheduled Floating Tag -->
  <g transform="translate(80, 310)" filter="url(#schedShadow)">
    <rect x="0" y="0" width="220" height="52" rx="14" fill="#FFFFFF"/>
    <circle cx="26" cy="26" r="12" fill="#DCFCE7"/>
    <path d="M20 26 l4 4 l8 -8" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="48" y="24" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Guaranteed Daily Slot</text>
    <text x="48" y="42" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Cooks • Maids • Car Detailing</text>
  </g>
</svg>