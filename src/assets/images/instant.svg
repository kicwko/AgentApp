<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="supportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>
    <filter id="fastShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF5841" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#supportBg)"/>
  <circle cx="300" cy="200" r="140" fill="#FED7AA" opacity="0.4"/>
  <circle cx="160" cy="110" r="50" fill="#FEE2E2" opacity="0.6"/>

  <!-- Speed Motion Lines -->
  <line x1="60" y1="160" x2="160" y2="160" stroke="#FF5841" stroke-width="4.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="195" x2="200" y2="195" stroke="#FF5841" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="50" y1="230" x2="170" y2="230" stroke="#FF5841" stroke-width="4.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="90" y1="265" x2="150" y2="265" stroke="#FF5841" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Motion ground shadow -->
  <ellipse cx="300" cy="330" rx="140" ry="14" fill="#FDBA74" opacity="0.45"/>

  <!-- Runner Sprints Forward -->
  <g transform="translate(190, 50)">
    <!-- Back Leg (Left) reaching far back in sprint -->
    <path d="M90 190 L55 240 L15 255" stroke="#0F172A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M12 255 h22 v10 a4 4 0 0 1 -4 4 h-18 z" fill="#FF5841"/>

    <!-- Front Leg (Right) bent high forward knee -->
    <path d="M98 190 L135 230 L120 280" stroke="#0F172A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M115 280 h24 v10 a4 4 0 0 1 -4 4 h-20 z" fill="#FF5841"/>

    <!-- Leaning Torso (Sunset Orange #FF5841) -->
    <path d="M85 95 L125 190 L85 195 L60 105 Z" fill="#FF5841"/>

    <!-- Cap & Head -->
    <circle cx="110" cy="65" r="22" fill="#FED7AA"/>
    <path d="M90 60 C90 40 135 40 135 60 Z" fill="#C53678"/>
    <path d="M105 60 h42 a4 4 0 0 1 4 4 v2 h-46 z" fill="#9F1239"/>

    <!-- Left Arm driving forward -->
    <path d="M78 105 L115 130 L145 115" stroke="#FF5841" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="115" r="9" fill="#FED7AA"/>

    <!-- Right Arm carrying red metal toolbox with tools -->
    <path d="M68 110 L40 155 L50 185" stroke="#FF5841" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="185" r="9" fill="#FED7AA"/>

    <!-- Red Metal Toolbox with Handle & Protruding Tools -->
    <g transform="translate(15, 175) rotate(14)">
      <rect x="0" y="15" width="70" height="38" rx="6" fill="#DC2626"/>
      <rect x="3" y="15" width="64" height="9" fill="#B91C1C"/>
      <!-- Handle -->
      <path d="M24 15 v-10 a4 4 0 0 1 8 0 v10" stroke="#475569" stroke-width="4" fill="none"/>
      <!-- Hammer & Wrench poking out -->
      <line x1="48" y1="15" x2="58" y2="-10" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
      <rect x="52" y="-18" width="18" height="9" rx="2" fill="#64748B"/>
      <line x1="18" y1="15" x2="10" y2="-6" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
      <!-- Clasp -->
      <rect x="30" y="30" width="10" height="8" rx="2" fill="#FDE047"/>
    </g>

    <!-- Speed Sweat / Wind effects -->
    <circle cx="140" cy="50" r="4.5" fill="#38BDF8"/>
    <circle cx="150" cy="65" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- High-Contrast 7-Minute SLA Badge -->
  <g filter="url(#fastShadow)" transform="translate(380, 290)">
    <rect x="0" y="0" width="180" height="64" rx="16" fill="#FFFFFF"/>
    <circle cx="30" cy="32" r="18" fill="#FFF1F2"/>
    <path d="M30 22v10l6 3" stroke="#FF5841" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="58" y="28" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#C53678">&lt; 7 Mins SLA</text>
    <text x="58" y="48" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">Doorstep Response</text>
  </g>
</svg>